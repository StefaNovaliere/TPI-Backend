server:
  port: 8084

spring:
  application:
    name: tpi-history
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tpi_history}
    username: ${SPRING_DATASOURCE_USERNAME:tpi}
    password: ${SPRING_DATASOURCE_PASSWORD:tpi}
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8090/realms/tpi/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
