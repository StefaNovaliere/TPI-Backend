server:
  port: 8083

spring:
  application:
    name: tpi-orders
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tpi_orders}
    username: ${SPRING_DATASOURCE_USERNAME:tpi}
    password: ${SPRING_DATASOURCE_PASSWORD:tpi}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8090/realms/tpi/protocol/openid-connect/certs}

# URLs de los microservicios con los que se comunica (vía REST).
services:
  users-uri: ${USERS_URI:http://localhost:8081}
  market-uri: ${MARKET_URI:http://localhost:8082}
  history-uri: ${HISTORY_URI:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
